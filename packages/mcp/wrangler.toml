# CargoFlow public remote MCP server: https://cargoflow-monad-mcp.adoranto737.workers.dev/mcp
# Deploy: pnpm deploy:worker (wrangler deploy). Local: pnpm dev:worker -> http://127.0.0.1:8787/mcp
name = "cargoflow-monad-mcp"
main = "src/worker.ts"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true

[vars]
CARGOFLOW_API_URL = "https://cargoflow-monad-api.onrender.com"
CARGOFLOW_APP_URL = "https://cargoflow-monad.vercel.app"
CARGOFLOW_RPC_URL = "https://testnet-rpc.monad.xyz"
